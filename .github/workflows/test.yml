name: Test skill
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/checkout@v7
        with:
          repository: bosen12/danbooru_tag_mochi
          path: .fixtures/mochi
      - name: CLI and live-engine contract tests (no GPU)
        env:
          DTR_ROOT: ${{ github.workspace }}/.fixtures/mochi
        run: python -m unittest discover -s tests -v
